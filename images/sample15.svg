<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Placeholder image 15">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(126)">
      <stop offset="0%" stop-color="#061028"/>
      <stop offset="55%" stop-color="#1b3f8f"/>
      <stop offset="100%" stop-color="#061028"/>
    </linearGradient>
    <radialGradient id="orb2f6bff"><stop offset="0%" stop-color="#8fd0ff" stop-opacity=".85"/><stop offset="55%" stop-color="#2f6bff" stop-opacity=".28"/><stop offset="100%" stop-color="#2f6bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb3f7cff"><stop offset="0%" stop-color="#b6e6ff" stop-opacity=".8"/><stop offset="55%" stop-color="#3f7cff" stop-opacity=".26"/><stop offset="100%" stop-color="#3f7cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb2a86ff"><stop offset="0%" stop-color="#a5e0ff" stop-opacity=".8"/><stop offset="55%" stop-color="#2a86ff" stop-opacity=".26"/><stop offset="100%" stop-color="#2a86ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb4a8cff"><stop offset="0%" stop-color="#cfeaff" stop-opacity=".8"/><stop offset="55%" stop-color="#4a8cff" stop-opacity=".24"/><stop offset="100%" stop-color="#4a8cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb3570ff"><stop offset="0%" stop-color="#9ad4ff" stop-opacity=".8"/><stop offset="55%" stop-color="#3570ff" stop-opacity=".26"/><stop offset="100%" stop-color="#3570ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cfeaff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#cfeaff" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#cfeaff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g filter="url(#soft)"><circle cx="809" cy="605" r="229" fill="url(#orb4a8cff)" opacity="0.47"/><circle cx="1026" cy="630" r="254" fill="url(#orb2f6bff)" opacity="0.41"/><circle cx="3" cy="12" r="302" fill="url(#orb3570ff)" opacity="0.31"/></g>

  <!-- diagonal light sweep -->
  <g transform="rotate(-18 800 500)">
    <rect x="-1600" y="479" width="4800" height="160" fill="url(#streak)"/>
  </g>

  <!-- grain -->
  <rect width="1600" height="1000" filter="url(#grain)" opacity=".055" style="mix-blend-mode:overlay"/>

  <!-- inner frame -->
  <rect x="56" y="35" width="1488" height="930" fill="none" stroke="#bfe0ff" stroke-opacity=".14" stroke-width="2"/>

  <!-- plate label -->
  <text x="120" y="925" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="42" letter-spacing="19" fill="#dceaff" fill-opacity=".5">PLATE 15</text>
  <circle cx="78" cy="908" r="8" fill="#e9d8a6" fill-opacity=".7"/>
</svg>
